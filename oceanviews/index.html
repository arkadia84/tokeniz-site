<style>
/* One pinned full-bleed photograph stage; the scroll is a single camera move backward from the sea into the apartment. */
:root{
  --gold:#C9B27C;
  --gold-hi:#E6D5A8;
  --teal:#00272C;
  --teal-deep:#00171B;
  --white:#FAFAF8;
  --mist:rgba(250,250,248,.82);
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--teal-deep);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--teal-deep);color:var(--white);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:4px}
h1,h2{font-family:var(--display);font-weight:500;line-height:1.03;margin:0;text-wrap:balance;letter-spacing:-.005em}
.eyebrow{font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-hi);margin:0}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:12px;padding:17px 30px;border-radius:999px;background:var(--gold);color:var(--teal);font-weight:600;font-size:16px;letter-spacing:.02em;text-decoration:none;transition:background .25s,transform .25s;box-shadow:0 12px 40px rgba(0,23,27,.45)}
.btn:hover{background:var(--gold-hi);transform:translateY(-2px)}
.btn i{width:7px;height:7px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg)}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:sheen 5.5s ease-in-out infinite}
@keyframes sheen{0%,62%{left:-60%}100%{left:130%}}

/* ---------- plain version: shown without scripting, without WebGL, or with reduced motion ---------- */
.plain figure{margin:0;position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.plain img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plain figure::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,23,27,.25),rgba(0,23,27,0) 30%,rgba(0,23,27,0) 45%,rgba(0,23,27,.78))}
.plain figcaption{position:relative;z-index:1;width:min(1180px,100% - 40px);margin:0 auto;padding:0 0 12vh}
.cap{display:flex;flex-direction:column;gap:16px;align-items:flex-start;max-width:600px;text-shadow:0 2px 30px rgba(0,23,27,.55)}
.cap h1{font-size:clamp(2.7rem,6vw,5.2rem)}
.cap h1 em,.cap h2 em{font-style:italic;color:var(--gold-hi)}
.cap h2{font-size:clamp(2.2rem,4.6vw,4rem)}
.cap p{margin:0;color:var(--mist);max-width:42ch}
.cap .logo{width:clamp(170px,20vw,290px);height:auto;display:block;filter:drop-shadow(0 4px 26px rgba(0,23,27,.45))}
.price{font-family:var(--display);font-weight:500;font-size:clamp(3.6rem,9vw,6.6rem);line-height:.95;font-variant-numeric:tabular-nums lining-nums}
.price small{display:block;font-family:var(--body);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-hi);margin-top:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;counter-reset:s;color:var(--white)}
.steps li{counter-increment:s;display:flex;gap:9px;align-items:baseline}
.steps li::before{content:counter(s);font-family:var(--display);font-size:20px;color:var(--gold-hi)}
.enter{display:none;flex-direction:column;gap:9px;width:100%;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
.gl .caps .enter{display:flex}
.enter i{display:block;height:2px;background:rgba(250,250,248,.18);border-radius:2px;overflow:hidden}
.enter b{display:block;height:100%;background:var(--gold-hi);transform-origin:0 50%;transform:scaleX(0)}
.mkp{background:var(--teal);padding:8vh 0 10vh;display:flex;flex-direction:column;gap:7vh}
.mkp figure{margin:0 auto;width:min(1180px,100% - 32px);display:flex;flex-direction:column;gap:14px}
.mkp figcaption{display:flex;flex-direction:column;gap:6px}
.mkp h2{font-size:clamp(1.7rem,3.4vw,2.8rem)}
.mkp figure img{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mkp .cap{margin:4vh auto 0;width:min(1180px,100% - 32px);max-width:none}
#layers{position:absolute;inset:0;display:none;overflow:hidden;z-index:0;isolation:isolate}
.nogl #layers{display:block}.nogl #view{display:none}
.lay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;will-change:transform,opacity}
.dim{position:absolute;inset:0;background:rgba(0,23,27,.66);opacity:0;pointer-events:none}
.mk{position:absolute;inset:0;pointer-events:none}
.mk-s{position:absolute;inset:0;opacity:0;visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:70px 0 26px}
.mk-s figcaption{width:min(1180px,100% - 40px);margin:0 auto;display:flex;flex-direction:column;gap:6px;text-shadow:0 2px 24px rgba(0,23,27,.6)}
.mk-s h2{font-size:clamp(1.7rem,3.4vw,2.8rem)}
.mk-win{align-self:flex-start;flex-shrink:0;height:min(66vh,(100vw - 40px)/1.3913);aspect-ratio:1280/920;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.55);will-change:transform}
.mk-win img{width:100%;height:100%;display:block}
@media (orientation:portrait){.mk-win{height:56vh;height:56svh}}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;gap:6px;max-width:210px}
.stats b{font-family:var(--display);font-weight:500;font-size:clamp(2.4rem,5vw,3.6rem);line-height:1;color:var(--gold-hi);font-variant-numeric:lining-nums}
.stats span{font-size:14px;line-height:1.4;color:var(--mist)}
.fine{font-size:11.5px!important;line-height:1.5;color:rgba(250,250,248,.6)!important;max-width:46ch}
.plain figcaption .cap+.cap{margin-top:5vh}
footer{padding:22px 20px 26px;text-align:center;font-size:12.5px;color:rgba(250,250,248,.62);background:var(--teal-deep)}
footer p{margin:0}

/* ---------- the journey (enabled by script) ---------- */
.journey{display:none}
.gl .plain{display:none}
.gl .journey{display:block;height:1575vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--teal-deep)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.grade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(75% 70% at 0% 100%,rgba(0,23,27,.62),rgba(0,23,27,0) 72%),
             radial-gradient(120% 90% at 50% 45%,rgba(0,23,27,0) 55%,rgba(0,23,27,.42) 100%),
             linear-gradient(rgba(0,23,27,.34),rgba(0,23,27,0) 22%,rgba(0,23,27,0) 48%,rgba(0,23,27,.72))}
.grain{position:absolute;inset:-50%;width:200%;height:200%;pointer-events:none;opacity:.055;mix-blend-mode:overlay;background-size:180px 180px;animation:grain 1.1s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.caps{position:absolute;left:0;right:0;bottom:13vh;height:0}
.caps .cap{position:absolute;left:max(20px,(100vw - 1180px)/2);bottom:0;width:min(600px,100vw - 40px);opacity:0;will-change:opacity,transform}
.caps .cap.off{visibility:hidden}
.caps .cap[data-cap="buy"],.caps .cap[data-cap="returns"]{padding:30px 32px;border-radius:6px;background:rgba(0,23,27,.58);border:1px solid rgba(250,250,248,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);gap:20px;text-shadow:none;box-shadow:0 24px 70px rgba(0,23,27,.4)}
@media (max-width:760px){.caps .cap[data-cap="buy"],.caps .cap[data-cap="returns"]{padding:24px 22px}}
.cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--white);text-shadow:0 1px 10px rgba(0,23,27,.7)}
.cue span{display:block;width:1px;height:40px;background:linear-gradient(var(--white),rgba(250,250,248,0));animation:cue 2.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes cue{0%{transform:scaleY(0);opacity:0}35%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) translateY(40px);opacity:0}}
.bar{position:absolute;left:0;right:0;top:0;height:60px;pointer-events:none}
.track{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(250,250,248,.16)}
.fill{position:absolute;inset:0;background:linear-gradient(90deg,rgba(201,178,124,.35),var(--gold-hi));transform-origin:0 50%;transform:scaleX(0)}
.mini{position:absolute;left:20px;top:16px;height:38px;opacity:0;transform:translateY(-6px);transition:opacity .6s,transform .6s}
.mini img{height:100%;width:auto;display:block;filter:drop-shadow(0 2px 12px rgba(0,23,27,.6))}
.moving .mini{opacity:1;transform:none}
.sticky-cta{position:absolute;right:22px;top:14px;padding:11px 20px;font-size:14px;opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.1,1),background .25s}
.moving .sticky-cta{opacity:1;transform:none;pointer-events:auto}
.ending .sticky-cta{opacity:0;transform:translateY(-10px);pointer-events:none}
@media (max-width:760px){
  .caps{bottom:11vh}
  .sticky-cta{padding:9px 15px;font-size:13px;right:14px;top:13px}
  .mini{left:14px;height:32px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
/* Where the marketplace act starts, in screens of scroll. */
var MK0=10.1,MKD=1.0;

var root=document.documentElement;
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var clamp=function(x,a,b){return Math.min(b,Math.max(a,x))},lerp=function(a,b,t){return a+(b-a)*t};
var sstep=function(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
function toMarket(e){e.preventDefault();
  var j=document.querySelector('.gl #journey');
  if(j)window.scrollTo({top:j.offsetTop+(MK0+.35)*j.querySelector('.stage').clientHeight,behavior:'smooth'});
  else{var m=document.getElementById('mkp');if(m)m.scrollIntoView({behavior:'smooth'})}}
$$('[data-market]').forEach(function(a){a.addEventListener('click',toMarket)});
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- WebGL ---------- */
var canvas=$('#view'),gl=null,A={},U={};
var VS='attribute vec3 a;attribute vec2 t;uniform vec3 uCam;uniform vec2 uVp,uFocus,uScale;varying vec2 v;varying vec2 c;'+
 'void main(){v=t;float w=a.z-uCam.z;'+
 'vec2 q=(a.xy-uVp)*a.z-uCam.xy+(uVp-uFocus)*w;'+
 'c=q*uScale/w;gl_Position=vec4(q*uScale,0.,w);}';
var FS='precision mediump float;varying vec2 v;varying vec2 c;uniform sampler2D uTex;uniform float uAlpha,uFeather,uMaskF;uniform vec4 uMask;'+
 'void main(){vec4 k=texture2D(uTex,v);float f=1.;'+
 'if(uFeather>0.){f=smoothstep(0.,uFeather,v.x)*smoothstep(0.,uFeather,1.-v.x)*smoothstep(0.,uFeather,v.y)*smoothstep(0.,uFeather,1.-v.y);}'+
 'if(uMaskF>0.){f*=smoothstep(uMask.x,uMask.x+uMaskF,c.x)*smoothstep(uMask.z,uMask.z-uMaskF,c.x)*smoothstep(uMask.y,uMask.y+uMaskF,c.y)*smoothstep(uMask.w,uMask.w-uMaskF,c.y);}'+
 'gl_FragColor=vec4(k.rgb,uAlpha*f);}';
function initGL(){
  try{gl=canvas.getContext('webgl',{antialias:true,alpha:false})||canvas.getContext('experimental-webgl')}catch(e){gl=null}
  if(!gl)return false;
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return gl.getShaderParameter(s,gl.COMPILE_STATUS)?s:null}
  var vs=sh(gl.VERTEX_SHADER,VS),fs=sh(gl.FRAGMENT_SHADER,FS);if(!vs||!fs)return false;
  var pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return false;
  gl.useProgram(pr);
  A={a:gl.getAttribLocation(pr,'a'),t:gl.getAttribLocation(pr,'t')};
  ['uCam','uVp','uFocus','uScale','uTex','uAlpha','uFeather','uMask','uMaskF'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n)});
  gl.enableVertexAttribArray(A.a);gl.enableVertexAttribArray(A.t);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0,0.09,0.105,1);
  return true;
}
/* Three ways to play the same journey: WebGL (full depth), plain layered images when WebGL is missing or
   is lost, and both stay scroll-driven when the device asks for reduced motion (no drift, tilt or grain). */
var useGL=false;try{useGL=initGL()}catch(e){useGL=false}
if(!useGL)root.classList.add('nogl');
canvas.addEventListener('webglcontextlost',function(e){e.preventDefault();useGL=false;root.classList.add('nogl')});
var small=Math.min(screen.width,screen.height)<700,TEXMAX=small?1280:2048;

var stage=$('#stage'),journey=$('#journey'),W=1,H=1,va=1;
/* ---------- shots ----------
   Each photo is laid on a simple model of its room: a back wall plus floor, ceiling and side walls
   receding from it. Moving the camera through that model gives true perspective motion.
   rect = back wall as fractions of the image; vp = vanishing point; focus = what stays centred on narrow screens. */
var ZMIN=0.34,ZO=2.6,CZ0=1.20;
function Shot(id,o){
  this.src=$('#img-'+id).getAttribute('src');this.img=new Image();this.o=o||{};this.ready=false;this.tex=null;
  this.ar=1;this.n=0;this.buf=null;this.vp=[0,0];
}
Shot.prototype.fx=function(f){return (f*2-1)*this.ar};
Shot.prototype.fy=function(f){return 1-f*2};
Shot.prototype.build=function(){
  var im=this.img,o=this.o,self=this;
  this.ar=im.naturalWidth/im.naturalHeight;
  if(!this.el){var el=document.createElement('img');el.className='lay';el.alt='';
    var fo=o.focus||(o.inside?[.5,.6]:[.5,.5]);el.style.objectPosition=el.style.transformOrigin=(fo[0]*100)+'% '+(fo[1]*100)+'%';this.el=el}
  if(!useGL){this.ready=true;return}
  if(!this.tex){var tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  var src=im,big=Math.max(im.naturalWidth,im.naturalHeight);
  if(big>TEXMAX){var k=TEXMAX/big,cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);src=cv}
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  this.tex=tex}
  var host=o.inside||this,ar=host.ar;                     /* a flat picture can sit on another shot's back wall */
  var x0=-ar,x1=ar,y0=1,y1=-1,nx=1,ny=1,r=null;
  var zf=1;
  if(o.inside){ /* the outside world: a far plane seen through the host's door */
    var F=frameOf(host),d=host.o.door,ocx=(host.fx(d.L)+host.fx(d.R))/2,ocy=(host.fy(d.T)+host.fy(d.B))/2;
    var xc=ocx/ZO+F.fx*(1-1/ZO),yc=ocy/ZO+F.fy*(1-1/ZO)+.16;
    var hP=Math.max(1.6/F.s,1.6*va/F.s/this.ar)*(ZO-CZ0)/ZO,wP=hP*this.ar;
    x0=xc-wP;x1=xc+wP;y0=yc+hP;y1=yc-hP;zf=ZO;this.vp=host.vp}
  else if(o.rect){nx=110;ny=74;this.vp=[this.fx(o.vp[0]),this.fy(o.vp[1])];
    r={L:this.fx(o.rect.L)-this.vp[0],R:this.fx(o.rect.R)-this.vp[0],T:this.fy(o.rect.T)-this.vp[1],B:this.fy(o.rect.B)-this.vp[1]}}
  var vp=this.vp,P=[],i,j;
  function depth(x,y){ if(!r)return zf; var qx=x-vp[0],qy=y-vp[1],z=1;
    if(qx<r.L)z=Math.min(z,r.L/qx); if(qx>r.R)z=Math.min(z,r.R/qx);
    if(qy>r.T)z=Math.min(z,r.T/qy); if(qy<r.B)z=Math.min(z,r.B/qy);
    return Math.max(ZMIN,z)}
  function vert(i,j){var u=i/nx,v=j/ny,x=lerp(x0,x1,u),y=lerp(y0,y1,v);P.push(x,y,depth(x,y),u,v)}
  for(j=0;j<ny;j++)for(i=0;i<nx;i++){vert(i,j);vert(i+1,j);vert(i,j+1);vert(i+1,j);vert(i+1,j+1);vert(i,j+1)}
  this.n=nx*ny*6;if(!this.buf)this.buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(P),gl.STATIC_DRAW);

var S={};
S.bed=new Shot('bed',{rect:{L:.335,R:.86,T:.247,B:.747},door:{L:.47,R:.692,T:.285,B:.705},vp:[.62,.60],focus:[.58,.50]});
S.sunset=new Shot('sunset',{inside:S.bed});
S.dawn=new Shot('dawn',{focus:[.42,.5]});
S.morning=new Shot('morning',{focus:[.64,.55]});
S.midday=new Shot('midday',{focus:[.38,.5]});
S.living=new Shot('living',{focus:[.42,.55]});
S.bed2=new Shot('bed2',{focus:[.62,.6]});
S.tower=new Shot('tower',{focus:[.40,.5]});
var layers=$('#layers');
['bed','sunset','midday','morning','dawn','living','bed2','tower'].forEach(function(k,i){S[k].z=i+1});
/* pictures load two at a time in the order the scroll needs them, so the first screen appears at once */
var QUEUE=['dawn','morning','midday','sunset','bed','living','bed2','tower'];
function loaded(k){S[k].loaded=true;try{if(k==='sunset'){if(S.bed.ready)S[k].build()}else{S[k].build();if(k==='bed'&&S.sunset.loaded)S.sunset.build()}}catch(e){}}
function nextImage(){var k=QUEUE.shift();if(!k)return;var im=S[k].img;
  im.onload=function(){loaded(k);nextImage()};im.onerror=nextImage;im.src=S[k].src}

/* ---------- captions (cloned from the plain version) ---------- */
var capsEl=$('#caps'),CAPS={};
$$('.plain .cap').forEach(function(c){var n=c.cloneNode(true);capsEl.appendChild(n);CAPS[n.getAttribute('data-cap')]=n});
$$('#caps [data-market]').forEach(function(a){a.addEventListener('click',toMarket)});
/* [caption, fade-in start, fade-in end, fade-out start, fade-out end] in screens of scroll */
var CUES=[['hero',-1,-.5,.30,.55],['view',.85,1.1,1.3,1.5],['beaches',1.75,2.0,2.15,2.35],['sunset',2.6,2.85,3.2,3.4],['bed',4.05,4.3,4.55,4.75],['living',5.3,5.55,6.0,6.2],['bed2',6.7,6.95,7.25,7.45],['returns',8.0,8.25,8.8,9.0],['buy',9.1,9.35,9.8,10.0],['close',MK0+4*MKD+.1,MK0+4*MKD+.35,99,100]];
var END=MK0+4*MKD+.65;
root.classList.add('gl');

/* film grain */
(function(){try{var k=document.createElement('canvas');k.width=k.height=180;var c=k.getContext('2d'),d=c.createImageData(180,180),i;
  for(i=0;i<d.data.length;i+=4){var v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}c.putImageData(d,0,0);
  $('#grain').style.backgroundImage='url('+k.toDataURL()+')'}catch(e){}})();

/* ---------- layout ---------- */

function resize(){
  W=stage.clientWidth;H=stage.clientHeight;va=W/H;
  var dpr=Math.min(window.devicePixelRatio||1,2),cap=2400/Math.max(W,H);dpr=Math.min(dpr,Math.max(1,cap));
  if(useGL){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);gl.viewport(0,0,canvas.width,canvas.height)}
  if(S.sunset&&S.sunset.loaded&&S.bed.ready){try{S.sunset.build()}catch(e){}}
}
addEventListener('resize',resize);resize();nextImage();nextImage();

/* ---------- pointer ---------- */
var tiltT=[0,0],tilt=[0,0];
if(!RM)addEventListener('pointermove',function(e){if(e.pointerType==='mouse'){tiltT[0]=(e.clientX/innerWidth-.5)*2;tiltT[1]=(e.clientY/innerHeight-.5)*2}},{passive:true});
if(!RM)addEventListener('deviceorientation',function(e){if(e.gamma==null)return;tiltT[0]=clamp(e.gamma/25,-1,1);tiltT[1]=clamp((e.beta-45)/30,-1,1)},{passive:true});

/* ---------- drawing one shot ---------- */
function frameOf(host){ /* cover scale and clamped focus for a photo on this screen */
  var s=Math.max(1,va/host.ar)*1.045,f=host.o.focus||[.5,.5];
  var fx=clamp(host.fx(f[0]),-(host.ar-va/s),host.ar-va/s),fy=clamp(host.fy(f[1]),-(1-1/s),1-1/s);
  return {s:s,fx:fx,fy:fy};
}
function drawCSS(shot,cz,alpha){
  var el=shot.el,m;if(!el)return;
  if(!el.parentNode){el.src=shot.src;layers.appendChild(el)}
  if(shot.o.inside){m=1.1;alpha*=sstep(.5,.88,cz)}else m=cz<.9?1/(1-cz):10;
  if(cz>=.9&&!shot.o.inside)alpha=0;
  shot.used=true;el.style.zIndex=shot.z;el.style.opacity=alpha.toFixed(3);el.style.transform='scale('+Math.min(m,10).toFixed(4)+')';
}
function draw(shot,cz,alpha,centre,drift){
  if(!shot.ready||alpha<.004)return;
  if(!useGL){drawCSS(shot,cz,alpha);return}
  var host=shot.o.inside||shot;if(!host.ready)return;
  var F=frameOf(host),cx=0,cy=0,vp=host.vp,w=1-cz,d=host.o.door,maskF=0,M=[0,0,0,0];
  if(centre>0&&d){var ocx=(host.fx(d.L)+host.fx(d.R))/2,ocy=(host.fy(d.T)+host.fy(d.B))/2;
    cx=centre*((ocx-vp[0])-(F.fx-vp[0])*w);cy=centre*((ocy-vp[1])-(F.fy-vp[1])*w)}
  var tk=.4+.6*clamp(w,0,1);
  cx+=(tilt[0]*.018+drift[0])*tk;cy+=(-tilt[1]*.012+drift[1])*tk;
  if(shot.o.inside&&w>.03){ /* only show the outside world through the door opening */
    var sx=F.s/va,sy=F.s;
    M=[((host.fx(d.L)-vp[0])-cx+(vp[0]-F.fx)*w)/w*sx,((host.fy(d.B)-vp[1])-cy+(vp[1]-F.fy)*w)/w*sy,
       ((host.fx(d.R)-vp[0])-cx+(vp[0]-F.fx)*w)/w*sx,((host.fy(d.T)-vp[1])-cy+(vp[1]-F.fy)*w)/w*sy];
    maskF=.035;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,shot.buf);
  gl.vertexAttribPointer(A.a,3,gl.FLOAT,false,20,0);gl.vertexAttribPointer(A.t,2,gl.FLOAT,false,20,12);
  gl.bindTexture(gl.TEXTURE_2D,shot.tex);
  gl.uniform3f(U.uCam,cx,cy,cz);gl.uniform2f(U.uVp,vp[0],vp[1]);gl.uniform2f(U.uFocus,F.fx,F.fy);
  gl.uniform2f(U.uScale,F.s/va,F.s);gl.uniform1f(U.uAlpha,alpha);gl.uniform1f(U.uFeather,shot.o.feather||0);
  gl.uniform4f(U.uMask,M[0],M[1],M[2],M[3]);gl.uniform1f(U.uMaskF,maskF);
  gl.drawArrays(gl.TRIANGLES,0,shot.n);
}
function track(u,keys){ /* magnification along scroll, eased in log space so the speed feels even */
  var i=0;while(i<keys.length-2&&u>keys[i+1][0])i++;
  var a=keys[i],b=keys[i+1],t=clamp((u-a[0])/(b[0]-a[0]),0,1);
  return Math.exp(lerp(Math.log(a[1]),Math.log(b[1]),t));
}

/* ---------- the frame ---------- */
var fill=$('#fill'),cue=$('#cue'),countEl=CAPS.buy.querySelector('[data-count]'),counted=false;
var cur=-1,last=performance.now(),time=0,lastSig='',enterBar=CAPS.buy.querySelector('.enter b'),dim=$('#dim'),mkLoaded=false,MKS=[];
$$('#mkp figure').forEach(function(f){var im=f.querySelector('img'),el=document.createElement('figure');el.className='mk-s';
  el.appendChild(f.querySelector('figcaption').cloneNode(true));
  var win=document.createElement('div');win.className='mk-win';var i2=document.createElement('img');i2.alt=im.alt;win.appendChild(i2);el.appendChild(win);
  $('#mk').appendChild(el);MKS.push({el:el,win:win,img:i2,src:im.getAttribute('src')})});
function countUp(el){var to=+el.getAttribute('data-count'),t0=performance.now();
  (function tick(now){var t=clamp((now-t0)/1600,0,1);el.textContent='$'+Math.round(to*(1-Math.pow(1-t,3))).toLocaleString('en-US');if(t<1)requestAnimationFrame(tick)})(t0)}
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){last=now;return}
  var dt=Math.min(.1,(now-last)/1000);last=now;time+=dt;
  var target=clamp((window.scrollY-journey.offsetTop)/H,0,END);
  if(cur<0)cur=target;
  cur+=(target-cur)*(1-Math.exp(-dt*7));if(Math.abs(target-cur)<.0004)cur=target;
  tilt[0]+=(tiltT[0]-tilt[0])*(1-Math.exp(-dt*3.5));tilt[1]+=(tiltT[1]-tilt[1])*(1-Math.exp(-dt*3.5));
  var u=cur,drift=RM?[0,0]:[Math.sin(time*.23)*.006,Math.sin(time*.17+1)*.004];

  /* camera path: outside on the view, back through the door, back across the room */
  var tb=clamp((u-3.0)/1.4,0,1);
  var czBed=u<3.0?lerp(CZ0,1-1/12,clamp((u-1.9)/1.1,0,1)):1-1/Math.exp(Math.log(12)*(1-sstep(0,1,tb*.6+sstep(0,1,tb)*.4)));
  var centre=sstep(0,.62,czBed);
  var aSun=sstep(.03,.30,czBed);
  var aDawn=1-sstep(.55,.95,u), mDawn=track(u,[[0,1.26],[.95,1.10]]);
  var aMorn=1-sstep(1.4,1.8,u), mMorn=track(u,[[.5,1.24],[1.8,1.06]]);
  var aMid=1-sstep(2.25,2.65,u), mMid=track(u,[[1.35,1.24],[2.65,1.06]]);
  var aLiv=sstep(4.7,5.05,u), mLiv=track(u,[[4.7,1.3],[6.6,1.04],[19,1.04]]);
  var aB2=sstep(6.2,6.55,u), mB2=track(u,[[6.2,1.3],[7.9,1.04],[19,1.04]]);
  var aTow=sstep(7.5,7.85,u), mTow=track(u,[[7.5,1.22],[END,1.02]]);

  if(useGL)gl.clear(gl.COLOR_BUFFER_BIT);else for(var q in S)S[q].used=false;
  if(aTow<1){
    if(aLiv<1&&aB2<1){
      if(aMid<1||!S.midday.ready){draw(S.bed,czBed,1,centre,drift);draw(S.sunset,czBed,aSun,centre,drift)}
      if(aMid>0&&(aMorn<1||!S.morning.ready))draw(S.midday,1-1/mMid,aMid,0,drift);
      if(aMorn>0&&(aDawn<1||!S.dawn.ready))draw(S.morning,1-1/mMorn,aMorn,0,drift);
      draw(S.dawn,1-1/mDawn,aDawn,0,drift);
    }
    if(aB2<1)draw(S.living,1-1/mLiv,aLiv,0,drift);
    draw(S.bed2,1-1/mB2,aB2,0,drift);
  }
  draw(S.tower,1-1/mTow,aTow,0,drift);
  if(!useGL)for(var q2 in S)if(!S[q2].used&&S[q2].el&&S[q2].el.parentNode)S[q2].el.style.opacity=0;

  /* captions and chrome */
  var sig=u.toFixed(3);
  if(sig!==lastSig){lastSig=sig;
    for(var i=0;i<CUES.length;i++){var c=CUES[i],el=CAPS[c[0]],a=sstep(c[1],c[2],u),b=1-sstep(c[3],c[4],u),o=a*b;
      el.style.opacity=o.toFixed(3);el.style.transform='translate3d(0,'+((1-a)*28-(1-b)*28).toFixed(1)+'px,0)';
      el.classList.toggle('off',o<.01)}
    fill.style.transform='scaleX('+(u/END).toFixed(4)+')';
    cue.style.opacity=(1-sstep(.03,.2,u)).toFixed(3);
    root.classList.toggle('moving',u>.6);root.classList.toggle('ending',u>7.85);
    if(!counted&&u>9.2){counted=true;countUp(countEl)}
    enterBar.style.transform='scaleX('+clamp((u-9.35)/.45,0,1).toFixed(3)+')';
    /* the marketplace: its four pages arrive one by one, and pan sideways on narrow screens */
    dim.style.opacity=(sstep(9.8,10.15,u)*(1-.3*sstep(MK0+4*MKD,MK0+4*MKD+.3,u))).toFixed(3);
    if(u>7.6&&!mkLoaded){mkLoaded=true;MKS.forEach(function(m){m.img.src=m.src})}
    for(var n=0;n<MKS.length;n++){var m=MKS[n],s0=MK0+n*MKD,a2=sstep(s0,s0+.2,u),b2=1-sstep(s0+MKD-.04,s0+MKD+.16,u),o2=a2*b2;
      m.el.style.opacity=o2.toFixed(3);m.el.style.visibility=o2<.01?'hidden':'visible';
      if(o2>=.01){var ww=m.win.offsetWidth,tx=ww<=W-32?(W-ww)/2:lerp(16,W-ww-16,sstep(0,1,clamp((u-s0-.22)/(MKD-.44),0,1)));
        m.win.style.transform='translate3d('+tx.toFixed(1)+'px,'+((1-a2)*46-(1-b2)*30).toFixed(1)+'px,0) scale('+(.955+.045*a2).toFixed(4)+')'}}
  }
}
requestAnimationFrame(frame);
})();
</script>
